<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Backorder Recambios · DAMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f5;--surface:#fff;--s2:#f8f9fb;--border:#e2e5ea;--border2:#d0d5de;
  --text:#1a1d23;--text2:#3d4251;--muted:#6b7280;--muted2:#9ca3af;
  --primary:#0d1b3e;--primary2:#1a3a6e;--blue:#1c57d6;--blue-bg:#eef3fc;
  --green:#1a7f4e;--green-bg:#eaf5ef;
  --red:#bb0a21;--red-bg:#fff0f0;--orange:#c47200;--orange-bg:#fff8ec;
  --mark:#ffe39a;
  --mono:"Source Code Pro",ui-monospace,Menlo,Consolas,monospace;--font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;--rs:6px;--sh:0 2px 8px rgba(0,0,0,.08);--sh-lg:0 12px 40px rgba(0,0,0,.2);
  color-scheme:light;
}
html{color-scheme:light}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0d1b3e;z-index:60}
[hidden]{display:none!important}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary2);outline-offset:2px}

/* HEADER */
.header{background:linear-gradient(135deg,#0d1b3e,#1a3a6e);color:#fff;padding:8px max(20px,env(safe-area-inset-right,0px)) 8px max(20px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;min-height:56px;box-shadow:0 2px 12px rgba(0,0,0,.3);position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
.htitle{font-size:.82rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.hsub{font-size:.62rem;opacity:.6;margin-top:1px;display:flex;align-items:center}
.hstats{display:flex;gap:5px;flex-wrap:wrap}
.hs{background:rgba(255,255,255,.1);border-radius:var(--rs);padding:4px 12px;text-align:center;cursor:pointer;border:1px solid rgba(255,255,255,.1);color:#fff;transition:background .15s;min-width:64px}
.hs:hover{background:rgba(255,255,255,.18)}
.hs-val{font-size:1rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.hs-lbl{font-size:.52rem;text-transform:uppercase;letter-spacing:.07em;opacity:.6;margin-top:1px}
.hs.hot{background:rgba(251,191,36,.22);border-color:rgba(251,191,36,.5)}
.conn{width:7px;height:7px;border-radius:50%;background:#f87171;display:inline-block;margin-right:5px}
.conn.on{background:#34d399;animation:pg 2s infinite}
@keyframes pg{0%,100%{opacity:1}50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.conn.on{animation:none}}

/* TABS */
.tabs{background:#fff;border-bottom:2px solid var(--border);padding:0 max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));display:flex;overflow-x:auto}
.tab{padding:13px 18px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;background:none;white-space:nowrap}
.tab:hover{color:var(--text);background:var(--s2)}
.tab.active{color:var(--primary2);border-bottom-color:var(--primary2)}

/* MAIN */
.main{max-width:1600px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.card{background:#fff;border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.card-hdr{background:linear-gradient(135deg,#0d1b3e,#1a3a6e);color:#fff;padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.card-body{padding:16px 18px}
.banner{border:1px solid var(--orange);background:var(--orange-bg);color:#7a4600;padding:10px 14px;border-radius:var(--rs);font-size:.82rem;margin-bottom:12px}
.summary{color:var(--muted);font-size:.8rem;margin:0 0 12px}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.toolbar label{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;color:var(--muted)}
.field,.toolbar select,.toolbar input[type=search]{padding:8px 10px;border-radius:var(--rs);border:1.5px solid var(--border2);background:#fff;font-size:.82rem;outline:none;min-width:0}
.field:focus,.toolbar select:focus,.toolbar input[type=search]:focus{border-color:var(--primary2)}
.toolbar .grow{flex:1 1 220px;min-width:0}
.toolbar .grow input{width:100%}
.fbtn{padding:5px 12px;border-radius:20px;border:1.5px solid var(--border2);background:#fff;font-size:.72rem;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.fbtn:hover,.fbtn.active{border-color:var(--primary2);background:var(--blue-bg);color:var(--primary2)}
.fbtn.new.active{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}
.fbtn.warn.active{border-color:var(--orange);background:var(--orange-bg);color:var(--orange)}
.fbtn.ok.active{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.fbtn.danger.active{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.fbtn .n{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--rs);background:var(--primary2);color:#fff;border:0;font-size:.78rem;font-weight:600;cursor:pointer}
.btn:hover{background:var(--primary)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.green{background:#1d6f42}.btn.green:hover{background:#155232}
.btn.ghost{background:#fff;color:var(--primary2);border:1.5px solid var(--border2)}
.btn.ghost:hover{background:var(--blue-bg)}

/* TABLE */
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.8rem;min-width:1420px}
th{padding:9px 9px;text-align:left;font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.88);font-weight:700;white-space:nowrap;background:linear-gradient(135deg,#0d1b3e,#1a3a6e)}
th.r,td.r{text-align:right}
td{padding:10px 9px;border-bottom:1px solid #eef0f4;vertical-align:top;color:var(--text2)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#f4f7ff}
tr.r-new td{background:#eaf1ff}
tr.r-chg td{background:#fff6e2}
tr.r-new:hover td{background:#dde9ff}
tr.r-chg:hover td{background:#ffefc9}
tr.r-gone td{opacity:.75}
tr.r-gone .mat{text-decoration:line-through;color:var(--muted)}
.empty{text-align:center;padding:44px 18px;color:var(--muted);font-size:.88rem}
.empty strong{display:block;color:var(--text);font-size:1rem;margin-bottom:4px}
.mat{font-family:var(--mono);font-weight:600;font-size:.86rem;color:var(--text)}
.sub{color:var(--muted);font-size:.72rem;font-variant-numeric:tabular-nums}
.big{font-weight:700;font-size:1.1rem;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--text)}
.val{font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.dt{font-weight:600;color:var(--text)}
.none{color:var(--muted2)}
.rel{font-size:.72rem;color:var(--muted)}
.rel.late{color:var(--red);font-weight:700}
.rel.soon{color:var(--green);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.badge{display:inline-block;font-size:.58rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1;padding:4px 6px;border-radius:4px;color:#fff;white-space:nowrap}
.b-new{background:var(--blue)}.b-chg{background:var(--orange)}.b-ok{background:var(--green)}.b-bad{background:var(--red)}.b-gone{background:var(--muted)}
.b-hot{background:#fff;color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.b-nov{background:var(--primary2)}
del{color:var(--muted);text-decoration:line-through}
ins{text-decoration:none;font-weight:700;background:var(--mark);color:var(--text);padding:0 3px;border-radius:3px}
.st{display:flex;gap:7px;align-items:baseline}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted2);transform:translateY(-1px)}
.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}.dot.info{background:var(--primary2)}
.veh-name{font-weight:600;color:var(--text)}
.plate{display:inline-block;font-family:var(--mono);font-weight:700;font-size:.74rem;letter-spacing:.06em;border:1.5px solid var(--text2);border-radius:4px;padding:1px 6px;margin:2px 0;background:#fff;color:var(--text)}
.vin{font-family:var(--mono);font-size:.68rem;color:var(--muted);overflow-wrap:anywhere}
.veh-days{font-size:.72rem;color:var(--muted);font-weight:600}
.veh-days.warn{color:var(--orange)}.veh-days.late{color:var(--red)}
.add-link{color:var(--primary2);font-size:.74rem;font-weight:600;border-bottom:1px dashed var(--primary2)}
.nov-txt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--text);overflow-wrap:anywhere;white-space:pre-line}
.gone-h{font-size:.9rem;font-weight:700;margin:6px 0 2px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(13,27,62,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 14px 20px;z-index:200;overflow-y:auto}
.modal{background:#fff;border-radius:var(--r);box-shadow:var(--sh-lg);width:100%;max-width:640px;overflow:hidden}
.mhdr{background:linear-gradient(135deg,#0d1b3e,#1a3a6e);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mtitle{font-family:var(--mono);font-weight:700;font-size:.95rem;overflow-wrap:anywhere}
.msub{font-size:.7rem;opacity:.7;margin-top:2px}
.mclose{background:rgba(255,255,255,.12);border:0;color:#fff;width:30px;height:30px;border-radius:var(--rs);font-size:1.2rem;line-height:1;cursor:pointer;flex:none}
.mclose:hover{background:rgba(255,255,255,.25)}
.mbody{padding:16px;display:flex;flex-direction:column;gap:16px}
.sect-t{font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin-bottom:8px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.fl{display:flex;flex-direction:column;gap:3px;font-size:.7rem;font-weight:600;color:var(--muted);min-width:0}
.fl .field{width:100%;font-weight:400;color:var(--text)}
.fl .mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
.hint{font-size:.7rem;color:var(--muted);font-weight:400}
.hint.err{color:var(--red);font-weight:600}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
textarea.field{min-height:74px;resize:vertical;width:100%;font-family:inherit}
.tl{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.nota{border:1px solid var(--border);border-left:3px solid var(--primary2);border-radius:var(--rs);padding:8px 10px;background:var(--s2)}
.nota-h{display:flex;justify-content:space-between;gap:8px;font-size:.68rem;color:var(--muted);margin-bottom:2px}
.nota-h b{color:var(--text2)}
.nota-t{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.nota-x{background:none;border:0;color:var(--muted2);cursor:pointer;font-size:.68rem;font-weight:600}
.nota-x:hover,.nota-x.arm{color:var(--red)}
.resum{background:var(--s2);border:1px solid var(--border);border-radius:var(--rs);padding:8px 10px;font-size:.78rem;display:flex;flex-wrap:wrap;gap:4px 14px}
.resum b{color:var(--text)}

/* CARGA */
.load-p{color:var(--muted);font-size:.82rem;margin-bottom:10px}
.paste{width:100%;min-height:170px;resize:vertical;font-family:var(--mono);font-size:.72rem;border:1.5px solid var(--border2);border-radius:var(--rs);padding:10px;background:var(--s2)}
.msg{font-size:.78rem;color:var(--muted)}
.msg.err{color:var(--red);font-weight:600}
.msg.good{color:var(--green);font-weight:600}

/* TOAST */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:300;align-items:center;max-width:92vw}
.toast{background:var(--primary);color:#fff;padding:9px 16px;border-radius:var(--rs);font-size:.8rem;font-weight:600;box-shadow:var(--sh-lg)}
.toast.err{background:var(--red)}

/* MOVIL: cada fila pasa a tarjeta */
@media (max-width:820px){
  table{min-width:0}
  thead{display:none}
  table,tbody,tr,td{display:block}
  tbody tr{border-bottom:1px solid var(--border);padding:8px 4px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
  td{border:0;padding:5px 8px;min-width:0}
  td.r{text-align:left}
  td.c-part,td.c-den,td.c-veh,td.c-nov{grid-column:1/-1}
  td.c-part{order:1}td.c-den{order:2}td.c-qty{order:3}td.c-arch{order:4}td.c-fp{order:5}td.c-date{order:6}td.c-veh{order:7}td.c-st{order:8}td.c-hot{order:9}td.c-nov{order:10}
  td::before{display:block;content:attr(data-label);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);font-weight:700;margin-bottom:1px}
  td.c-part::before{display:none}
  .toolbar label[for=me]{flex:1 1 100%}
  tbody tr:hover td{background:transparent}
  tr.r-new,tr.r-chg{background:inherit}
  tr.r-new{background:#eaf1ff}tr.r-chg{background:#fff6e2}
  tr.r-new td,tr.r-chg td{background:transparent}
  .fgrid{grid-template-columns:1fr}
  .hstats{width:100%}
  .hs{flex:1 1 60px}
}

/* denominación, archivo, hotline, info y marca */
.den{font-weight:600;color:var(--text);overflow-wrap:anywhere}
.mono-s{font-family:var(--mono);font-weight:600;font-size:.76rem;color:var(--text);overflow-wrap:anywhere}
.hs.alert{background:rgba(248,113,113,.32);border-color:#f87171}
.ask{display:inline-block;margin-top:5px;font-size:.68rem;font-weight:700;padding:4px 9px;border-radius:var(--rs);border:1.5px solid var(--primary2);background:#fff;color:var(--primary2);cursor:pointer}
.ask:hover{background:var(--blue-bg)}
.ask.att{border-color:var(--red);background:var(--red);color:#fff}
.ask.att:hover{background:#96081a}
.ask-on{color:var(--red);font-size:.72rem;margin-top:4px}
.marca-l{margin-top:4px;color:var(--text);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.solbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--border);background:var(--s2);border-radius:var(--rs);padding:8px 10px;font-size:.78rem}
.solbar.on{border-color:var(--red);background:var(--red-bg);color:var(--red)}
details.marca{border:1px solid var(--border);border-radius:var(--rs);background:var(--s2)}
details.marca>summary{cursor:pointer;padding:10px 12px;font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;gap:8px;list-style:none}
details.marca>summary::-webkit-details-marker{display:none}
details.marca>summary::before{content:"▸";margin-right:6px;transition:transform .15s}
details.marca[open]>summary::before{transform:rotate(90deg)}
details.marca>summary span:first-child{flex:1}
.cnt{background:var(--primary2);color:#fff;border-radius:10px;padding:0 7px;font-size:.62rem}
.cnt:empty{display:none}
.marca-in{padding:0 12px 12px}
.nota.marca-n{border-left-color:var(--red);background:#fff}

</style>
</head>
<body>
<header class="header">
  <div>
    <div class="htitle">Backorder · Recambios</div>
    <div class="hsub"><span class="conn" id="connDot"></span><span id="hsub">DAMA · piezas pendientes de entrega</span></div>
  </div>
  <div class="hstats" id="hstats"></div>
</header>

<nav class="tabs" aria-label="Secciones">
  <button class="tab active" type="button" data-tab="lista" id="tabLista">Pendientes</button>
  <button class="tab" type="button" data-tab="carga" id="tabCarga">Cargar listado</button>
</nav>

<main class="main">
  <section id="viewLista">
    <div class="banner" id="stale" hidden></div>
    <div class="toolbar">
      <label for="daySel">Listado del <select id="daySel"></select></label>
      <div class="grow"><input type="search" id="q" placeholder="Buscar pieza, pedido, matrícula, bastidor o modelo" aria-label="Buscar"></div>
      <label for="sortSel">Orden
        <select id="sortSel">
          <option value="changes">Cambios primero</option>
          <option value="date">Llegada prevista</option>
          <option value="veh">Vehículo más tiempo parado</option>
          <option value="age">Más antiguas</option>
          <option value="value">Mayor valor</option>
        </select>
      </label>
      <label for="me">Tu nombre <input class="field" type="text" id="me" placeholder="Para firmar" autocomplete="off" style="width:130px"></label>
      <button class="btn ghost" type="button" id="btnNotif" hidden>Activar avisos</button>
      <button class="btn green" type="button" id="btnCsv">Exportar CSV</button>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Filtros"></div>
    <p class="summary" id="summary"></p>
    <div class="card"><div class="twrap" id="listWrap"></div></div>
    <div id="goneBox" hidden>
      <p class="gone-h" id="goneTitle"></p>
      <p class="summary" id="goneSub"></p>
      <div class="card"><div class="twrap" id="goneWrap"></div></div>
    </div>
  </section>

  <section id="viewCarga" hidden>
    <div class="card">
      <div class="card-hdr"><span>Cargar el listado de hoy</span></div>
      <div class="card-body">
        <p class="load-p">Pega el backorder tal como sale del sistema, con todas las columnas. La página marca sola lo que cambió respecto al listado anterior y conserva los datos de vehículo y las novedades de cada pieza.</p>
        <textarea class="paste" id="paste" spellcheck="false" aria-label="Listado de backorder" placeholder="0002486876   000080   ..."></textarea>
        <div class="mrow" style="margin-top:10px">
          <label class="fl" for="loadDate" style="flex-direction:row;align-items:center;gap:8px">Fecha del listado <input class="field" type="date" id="loadDate"></label>
          <button class="btn" type="button" id="btnSave" disabled>Guardar listado</button>
        </div>
        <p class="msg" id="loadMsg" style="margin-top:8px"></p>
      </div>
    </div>
  </section>
</main>

<div class="overlay" id="ov" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mhdr">
      <div><div class="mtitle" id="mTitle"></div><div class="msub" id="mSub"></div></div>
      <button class="mclose" type="button" id="mClose" aria-label="Cerrar">&times;</button>
    </div>
    <div class="mbody" id="mBody"></div>
  </div>
</div>
<datalist id="dlPlates"></datalist>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* Almacén: Firebase Realtime Database (mismo proyecto que las otras páginas) */
var FB_URL = 'https://accesorios-alcala-default-rtdb.europe-west1.firebasedatabase.app';
var FB_KEY = 'AIzaSyDApTnRdr3LLFowFDzbu_WfDF4teKT75Wo';
var DB_BO = 'backorder_v1';
var Store = (function () {
  var fdb = null;
  function ref(p) { return fdb.ref(DB_BO + '/' + p); }
  return {
    mode: 'firebase',
    start: function (h) {
      try {
        firebase.initializeApp({ apiKey: FB_KEY, databaseURL: FB_URL, projectId: 'accesorios-alcala' });
        fdb = firebase.database();
      } catch (e) { h.onError(e); return; }
      fdb.ref('.info/connected').on('value', function (s) { h.onConn(!!s.val()); });
      ref('listados').orderByKey().limitToLast(45).on('value', function (s) {
        var v = s.val() || {};
        h.onSnaps(Object.keys(v).map(function (k) { return v[k]; }).filter(function (x) { return x && x.date; }));
      }, h.onError);
      ref('info').on('value', function (s) { h.onInfo(s.val() || {}); }, h.onError);
      ref('notas').on('value', function (s) {
        var v = s.val() || {}, m = {};
        Object.keys(v).forEach(function (k) { m[k] = Object.keys(v[k]).map(function (id) { return v[k][id]; }); });
        h.onNotas(m);
      }, h.onError);

      SN = arr.map(function (s) { s.rows = (Array.isArray(s.rows) ? s.rows : Object.values(s.rows || {})).map(normRow); return s; })
        .sort(function (a, b) { return b.date.localeCompare(a.date); });
      if (!sel || !SN.some(function (s) { return s.date === sel; })) sel = SN.length ? SN[0].date : null;
      loaded = true; loadErr = null; schedule();
    },
    onInfo: function (m) { INFO = m || {}; detectSol(); schedule(); },
    onNotas: function (m) {
      NOTAS = {};
      Object.keys(m || {}).forEach(function (k) { NOTAS[k] = (m[k] || []).filter(Boolean).sort(function (a, b) { return String(a.ts).localeCompare(String(b.ts)); }); });
      schedule(); renderNotas();
    },
    onConn: function (b) { $('connDot').classList.toggle('on', !!b); },
    onError: function (err) { loadErr = err || true; loaded = true; schedule(); }
  });
})();

</script>
</body>
